name: Package releases

on:
  push:
    branches: [main]

concurrency:
  group: package-releases-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify packages and documentation
        run: |
          npm test
          npm run build

      - name: Select release mode
        id: select-mode
        uses: changesets/action/select-mode@v2.1.2

  version:
    needs: prepare
    if: needs.prepare.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create or update the version pull request
        uses: changesets/action/version@v2.1.2
        with:
          script: npm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

  publish:
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use npm with trusted publishing support
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Publish changed packages
        uses: changesets/action/publish@v2.1.2
        with:
          script: npm run release
          create-github-releases: false
